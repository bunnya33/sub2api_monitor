appId: com.sub2api.quota-monitor
productName: Sub2API Quota Monitor
publish:
  - provider: github
    owner: bunnya33
    repo: sub2api_monitor
electronDist: node_modules/electron/dist
directories:
  output: release
files:
  - out/**/*
  - assets/**/*
  - package.json
  - '!node_modules/koffi/build/koffi/!(win32_x64)/**/*'
asarUnpack:
  - node_modules/koffi/build/koffi/win32_x64/*.node
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/app.ico
nsis:
  artifactName: Sub2API-Quota-Monitor-Setup-${version}.${ext}
asar: true
